<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="mb-4">📚 Quản lý Quiz & Câu hỏi</h2>
    <a href="/home" class="btn btn-secondary mb-3">⬅ Về Trang chủ</a>

    <!-- Quản lý Quiz -->
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="m-0">Danh sách Quiz</h5>
        <button class="btn btn-primary btn-sm" onclick="showAddQuiz()">+ Thêm Quiz</button>
      </div>
      <ul class="list-group list-group-flush" id="quizList"></ul>
    </div>

    <!-- Quản lý Câu hỏi -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="m-0">Câu hỏi trong Quiz: <span id="selectedQuizName">—</span></h5>
        <button class="btn btn-success btn-sm" id="addQuestionBtn" disabled>+ Thêm Câu hỏi</button>
      </div>
      <ul class="list-group list-group-flush" id="questionList"></ul>
    </div>
  </div>

  <!-- Modal thêm Quiz -->
  <div class="modal" tabindex="-1" id="quizModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Thêm Quiz</h5></div>
        <div class="modal-body">
          <input type="text" id="quizName" class="form-control" placeholder="Tên quiz">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" onclick="addQuiz()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal sửa Quiz -->
  <div class="modal" tabindex="-1" id="editQuizModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Sửa Quiz</h5></div>
        <div class="modal-body">
          <input type="text" id="editQuizName" class="form-control">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" onclick="updateQuiz()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal thêm Câu hỏi -->
  <div class="modal" tabindex="-1" id="questionModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Thêm Câu hỏi</h5></div>
        <div class="modal-body">
          <input type="text" id="qText" class="form-control mb-2" placeholder="Nội dung câu hỏi">
          <div id="optionsBox"></div>
          <button class="btn btn-outline-secondary btn-sm mb-2" onclick="addOptionField()">+ Thêm đáp án</button>
          <input type="text" id="correctAnswer" class="form-control" placeholder="Đáp án đúng (A/B/C/...)">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-success" onclick="addQuestion()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal sửa Câu hỏi -->
  <div class="modal" tabindex="-1" id="editQuestionModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Sửa Câu hỏi</h5></div>
        <div class="modal-body">
          <input type="text" id="editQText" class="form-control mb-2">
          <div id="editOptionsBox"></div>
          <input type="text" id="editCorrectAnswer" class="form-control mt-2" placeholder="Đáp án đúng (A/B/C/...)">
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-success" onclick="updateQuestion()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
