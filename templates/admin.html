<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css?ts={{ timestamp }}">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="mb-4">📚 Quản lý Quiz & Câu hỏi</h2>
    <a href="/home" class="btn btn-secondary mb-3">⬅ Về Trang chủ</a>

    <!-- Quản lý Quiz -->
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="m-0">Danh sách Quiz</h5>
        <button class="btn btn-primary btn-sm" onclick="showAddQuiz()">+ Thêm Quiz</button>
      </div>
      <ul class="list-group list-group-flush" id="quizList"></ul>
    </div>

    <!-- Modal xem danh sách câu hỏi -->
    <div class="modal fade" tabindex="-1" id="viewQuestionsModal">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Danh sách câu hỏi của quiz: <span id="viewQuizName"></span></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <ul class="list-group" id="viewQuestionList"></ul>
            <button class="btn btn-success mt-3" onclick="showAddQuestion()">+ Thêm Câu hỏi</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal thêm Quiz -->
    <div class="modal" tabindex="-1" id="quizModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Thêm Quiz</h5></div>
          <div class="modal-body">
            <input type="text" id="quizName" class="form-control" placeholder="Tên quiz">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button class="btn btn-primary" onclick="addQuiz()">Lưu</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal sửa Quiz -->
    <div class="modal" tabindex="-1" id="editQuizModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Sửa Quiz</h5></div>
          <div class="modal-body">
            <input type="text" id="editQuizName" class="form-control">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button class="btn btn-primary" onclick="updateQuiz()">Lưu</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal thêm Câu hỏi -->
    <div class="modal" tabindex="-1" id="questionModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Thêm Câu hỏi</h5></div>
          <div class="modal-body">
            <input type="text" id="qText" class="form-control mb-2" placeholder="Nội dung câu hỏi">

            <label class="form-label">Loại câu hỏi</label>
            <select id="qType" class="form-select mb-2" onchange="renderOptionsByType()">
              <option value="mcq">Trắc nghiệm (ABCD)</option>
              <option value="true_false">Đúng / Sai</option>
              <option value="note">Tự nhập (Note)</option>
            </select>

            <div id="optionsBox"></div>
            <input type="text" id="correctAnswer" class="form-control mt-2" placeholder="Đáp án đúng (A/B/C/...)">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button class="btn btn-success" onclick="addQuestion()">Lưu</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal sửa Câu hỏi -->
    <div class="modal fade" tabindex="-1" id="editQuestionModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Sửa Câu hỏi</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <label class="form-label">Nội dung câu hỏi</label>
            <input type="text" id="editQText" class="form-control mb-3">

            <label class="form-label">Loại câu hỏi</label>
            <select id="editQType" class="form-select mb-2" onchange="renderEditOptionsByType()">
              <option value="mcq">Trắc nghiệm (ABCD)</option>
              <option value="true_false">Đúng / Sai</option>
              <option value="note">Tự nhập (Note)</option>
            </select>

            <label class="form-label">Các lựa chọn</label>
            <div id="editOptionsBox" class="mb-3"></div>

            <label class="form-label">Đáp án đúng</label>
            <input type="text" id="editCorrectAnswer" class="form-control">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button class="btn btn-success" onclick="updateQuestion()">Lưu thay đổi</button>
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/admin.js?ts={{ timestamp }}"></script>
</body>
</html>
