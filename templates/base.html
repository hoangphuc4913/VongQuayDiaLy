<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vòng Quay Địa Lý{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background-color: #1e293b;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            padding-left: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .navbar .menu a {
            color: white;
            text-decoration: none;
            margin-left: 10px;
            margin-right: 10px;
            transition: 0.3s;
        }

        .navbar .menu a:hover {
            color: #38bdf8;
        }

        /* ===== CONTENT ===== */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background: #1e293b;
            color: white;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar .menu {
                margin-top: 10px;
            }

            .navbar .menu a {
                margin-left: 0;
            }
        }
    </style>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="navbar">
        <div class="logo">Vòng Quay Địa Lý</div>
        <div class="menu">
            <a href="/">Trang chủ</a>
            <a href="/flashcard">Thẻ ghi nhớ</a>
        </div>
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <div class="footer">
        © 2026 Vòng Quay Địa Lý. All rights reserved.
    </div>

    {% block extra_js %}{% endblock %}

</body>
</html>
