{% extends "base.html" %}

{% block title %}Flashcard{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', path='css/flashcard.css') }}">
{% endblock %}

{% block content %}

<div class="container py-3">
    <div class="d-flex justify-content-between align-items-center">
        <h4>📚 Flashcard</h4>
        <a href="/home" class="btn btn-outline-dark btn-sm">Trang chủ</a>
    </div>
</div>

<h5 class="px-3">Chọn tỉnh thành</h5>
<div id="quiz-container" class="d-flex flex-wrap px-3"></div>

<div class="flashcard-wrapper d-none" id="flashcard-section">

    <!-- Hiển thị câu x/y -->
    <div class="mb-3 fw-bold" id="progress-text">
        Câu 1 / 1
    </div>

    <div class="flashcard" id="flashcard">
        <div class="flashcard-inner">
            <div class="flashcard-front" id="card-front">
                Câu hỏi
            </div>
            <div class="flashcard-back" id="card-back">
                Đáp án
            </div>
        </div>
    </div>

    <div class="mt-3 text-center">
        <button class="btn btn-secondary me-2" id="prevBtn">Previous</button>
        <button class="btn btn-secondary" id="nextBtn">Next</button>
    </div>

</div>

<script src="/static/js/flashcard.js?ts={{ timestamp }}"></script>

{% endblock %}
