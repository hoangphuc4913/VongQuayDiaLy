<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="/static/css/game.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-3">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-3">
          <h5 class="m-0">👤 Lượt của: <span id="currentPlayerName">—</span></h5>
          <span class="badge text-bg-secondary">Lượt: <span id="roundInfo">1/1</span></span>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-dark btn-sm" href="/home">Trang chủ</a>
          <button class="btn btn-dark btn-sm" onclick="openQrScanner()">Quét mã QR</button>
        </div>
      </div>
      <div id="scoreboard" class="mt-3"></div>
    </div>

    <h2 class="px-3">🎮 Select a Quiz</h2>
    <div id="button-container" class="d-flex flex-wrap px-3"></div>

    <div id="popup" class="popup">
        <div id="popup-content"></div>
    </div>

    <!-- Modal quét QR -->
    <div id="qr-modal" class="popup">
      <div id="qr-content">
        <h5 class="mb-2">Quét mã QR</h5>
        <div id="qr-reader" style="width:100%;"></div>
        <button class="btn btn-secondary mt-2" onclick="closeQrScanner()">Đóng</button>
      </div>
    </div>

    <!-- Thư viện QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="/static/js/game.js"></script>
</body>
</html>
