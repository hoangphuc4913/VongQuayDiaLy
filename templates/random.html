{% extends "base.html" %}

{% block title %}🎡 Vòng quay Random{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', path='css/random.css') }}">
{% endblock %}

{% block content %}
  <div class="container py-4 text-center">
    <div class="d-flex justify-content-between mb-3">
      <h4>🎡 Vòng quay Random</h4>
      <a href="/home" class="btn btn-outline-dark">Trang chủ</a>
    </div>

    <h5>👤 Lượt của: <span id="currentPlayerName">—</span></h5>
    <div id="scoreboard" class="mt-2"></div>
    <span class="badge text-bg-secondary mt-2">Lượt: <span id="roundInfo">1/1</span></span>

    <!-- Bánh xe + kim chỉ -->
    <div class="position-relative d-inline-block mt-4">
      <canvas id="wheelCanvas" width="500" height="500"></canvas>
      <!-- Kim chỉ bên phải -->
      <div id="pointer"></div>
    </div>
    <p id="selectedQuizName" class="mt-3 text-primary fw-bold"></p>

    <div class="mt-3">
      <button class="btn btn-success btn-lg" id="spinBtn">Quay vòng</button>
    </div>

    <div id="popup" class="popup">
      <div id="popup-content">
          <!-- Ảnh câu hỏi -->
          <div id="question-image-box" style="display:none;margin-bottom:15px;">
              <img
                  id="question-image"
                  style="
                      max-width:100%;
                      max-height:260px;
                      object-fit:contain;
                      border:1px solid #ccc;
                      border-radius:10px;">
          </div>
          <!-- Nội dung câu hỏi -->
          <div id="question-text"></div>
          <!-- Đáp án -->
          <div id="answer-container"></div>

      </div>
    </div>
  </div>
  <script src="/static/js/random.js?ts={{ timestamp }}"></script>
{% endblock %}
