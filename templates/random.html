<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Random Wheel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/random.css">
</head>
<body class="bg-light">
  <div class="container py-4 text-center">
    <div class="d-flex justify-content-between mb-3">
      <h4>🎡 Vòng quay Random</h4>
      <a href="/home" class="btn btn-outline-dark">Trang chủ</a>
    </div>

    <h5>👤 Lượt của: <span id="currentPlayerName">—</span></h5>
    <div id="scoreboard" class="mt-2"></div>
    <span class="badge text-bg-secondary mt-2">Lượt: <span id="roundInfo">1/1</span></span>

    <!-- Bánh xe + kim chỉ -->
    <div class="position-relative d-inline-block mt-4">
      <canvas id="wheelCanvas" width="500" height="500"></canvas>
      <!-- Kim chỉ -->
      <div id="pointer"></div>
    </div>

    <div class="mt-3">
      <button class="btn btn-success btn-lg" id="spinBtn">Quay vòng</button>
    </div>

    <div id="popup" class="popup">
      <div id="popup-content"></div>
    </div>
  </div>

  <script src="/static/js/random.js"></script>
</body>
</html>
