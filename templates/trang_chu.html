<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang chủ Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/home.css?ts={{ timestamp }}">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="mb-3">🏠 Trang chủ Quiz</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-sm-6">
            <label class="form-label">Số người chơi</label>
            <input id="numPlayers" class="form-control" type="number" min="1" max="12" placeholder="VD: 4" />
          </div>
          <div class="col-sm-6">
            <label class="form-label">Số lượt chơi</label>
            <input id="numRounds" class="form-control" type="number" min="1" max="50" placeholder="VD: 5" />
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-dark" id="nextBtn">Tiếp theo</button>
        </div>
      </div>
    </div>

    <!-- UI nhập tên người chơi -->
    <div id="namePanel" class="card shadow-sm mt-4 d-none">
      <div class="card-body">
        <h5 class="card-title">Nhập tên người chơi</h5>
        <div id="playerNames" class="row g-2"></div>
        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-secondary" id="backBtn">Quay lại</button>
          <button class="btn btn-primary" id="startNormalBtn">Bắt đầu chế độ thường</button>
          <button class="btn btn-success" id="startRandomBtn">Bắt đầu chế độ random</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/home.js?ts={{ timestamp }}"></script>
</body>
</html>
